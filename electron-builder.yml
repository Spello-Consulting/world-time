appId: com.spelloconsulting.worldtime
productName: World Time
copyright: Copyright © 2026 Spello Consulting

directories:
  buildResources: build
  output: dist

# Only ship the compiled output and production node_modules.
files:
  - out/**/*
  - "!**/*.map"

# electron-vite emits to out/; main entry is out/main/index.js (see package.json "main").
asar: true

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # 12.0+ is required to ship an arm64-only build (Apple silicon). Below 12.0,
  # the Mac App Store demands a universal x86_64+arm64 binary. Raise as needed.
  minimumSystemVersion: "12.0"
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSApplicationCategoryType: public.app-category.productivity
    NSHumanReadableCopyright: Copyright © 2026 Spello Consulting

# Local, notarizable build for testing outside the store.
dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}.${ext}

# Mac App Store build.
mas:
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: false
  # Do NOT pin `identity` here: electron-builder reuses the app identity string as
  # the name filter when it looks up the "3rd Party Mac Developer Installer" cert
  # for the .pkg (macPackager: findIdentity(certType, mas.identity)). Pinning the
  # app cert makes that installer lookup search for an installer cert with the app
  # cert's name and fail. Auto-discovery selects the correct app + installer certs.
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  # Provisioning profile from the Apple Developer portal (Mac App Store type).
  provisioningProfile: build/embedded.provisionprofile

# For a signed DMG you can notarize with notarytool (see README).
# afterSign hooks for notarization are intentionally omitted so an unsigned
# `--dir` / `dmg` build works without an Apple account during development.
